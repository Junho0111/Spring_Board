<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link th:href="@{/css/bootstrap.min.css}" href="../css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 560px; }
        .field-error { border-color: #dc3545; color: #dc3545; }
    </style>
</head>
<body>
<div class="container">
    <div class="py-5 text-center">
        <h2>네이버 회원가입</h2>
        <p class="lead">서비스에서 사용할 이름을 입력해주세요.</p>
    </div>

    <form th:action="@{/members/add/naver}" th:object="${naverJoinForm}" method="post">
        <!-- 네이버 고유 ID를 서버로 전송하기 위해 hidden 필드 사용 -->
        <input type="hidden" th:field="*{naverId}">

        <div th:if="${#fields.hasGlobalErrors()}">
            <p class="field-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}">전체 오류 메시지</p>
        </div>

        <div>
            <label for="name">사용할 이름</label>
            <input type="text" id="name" th:field="*{name}" class="form-control"
                   th:errorclass="field-error" placeholder="이름을 입력하세요">
            <div class="field-error" th:errors="*{name}">이름 오류</div>
        </div>

        <div>
            <label for="password">사용할 비밀번호</label>
            <input type="password" id="password" th:field="*{password}" class="form-control"
                   th:errorclass="field-error" placeholder="비밀번호를 입력하세요">
            <div class="field-error" th:errors="*{password}">비밀번호 오류</div>
        </div>

        <hr class="my-4">

        <div class="row">
            <div class="col">
                <button class="w-100 btn btn-primary btn-lg" type="submit">가입 완료</button>
            </div>
            <div class="col">
                <button class="w-100 btn btn-secondary btn-lg"
                        th:onclick="|location.href='@{/}'|" type="button">취소</button>
            </div>
        </div>
    </form>
</div>
</body>
</html>

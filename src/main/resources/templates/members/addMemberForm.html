<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link th:href="@{/css/bootstrap.min.css}" href="../css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
        max-width: 560px;
        }
        .field-error {
         border-color: #dc3545; color: #dc3545;
         }
    </style>
</head>
<body>
<div class="container">
    <div class="py-5 text-center">
        <h2>회원 가입</h2>
    </div>

    <form action="" th:action th:object="${member}" method="post">

        <!-- OAuth 중복 가입 에러 메시지 표시 -->
        <div th:if="${param.alreadyRegistered}">
            <p class="field-error text-center mb-3">이미 연동된 계정으로 가입된 회원입니다. 로그인해 주세요.</p>
        </div>

        <!-- OAuth 미가입 계정 로그인 시도 에러 메시지 표시 -->
        <div th:if="${param.notRegistered}">
            <p class="field-error text-center mb-3">존재하지 않는 계정입니다. 회원가입을 먼저 진행해 주세요.</p>
        </div>

        <div th:if="${#fields.hasGlobalErrors()}">
            <p class="field-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}">
                전체 오류 메시지
            </p>
        </div>

        <div>
            <label for="loginId" th:text="#{label.member.loginId}">로그인 ID</label>
            <input type="text" id="loginId" th:field="*{loginId}" class="form-control"
                   th:errorclass="field-error" placeholder="아이디를 입력하세요">
            <div class="field-error" th:errors="*{loginId}">아이디 오류</div>
        </div>

        <div>
            <label for="password" th:text="#{label.member.password}">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" class="form-control"
                   th:errorclass="field-error" placeholder="비밀번호를 입력하세요">
            <div class="field-error" th:errors="*{password}">비밀번호 오류</div>
        </div>

        <div>
            <label for="name" th:text="#{label.member.name}">이름</label>
            <input type="text" id="name" th:field="*{name}" class="form-control"
                   th:errorclass="field-error" placeholder="이름을 입력하세요">
            <div class="field-error" th:errors="*{name}">이름 오류</div>
        </div>

        <hr class="my-4">

        <div class="row">
            <div class="col">
                <button class="w-100 btn btn-primary btn-lg" type="submit"
                        th:text="#{button.save}">회원 가입</button>
            </div>
            <div class="col">
                <button class="w-100 btn btn-secondary btn-lg"
                        onclick="location.href='home.html'"
                        th:onclick="|location.href='@{/}'|"
                        type="button" th:text="#{button.cancel}">취소
                </button>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col">
                <a th:href="${kakaoLoginUrl}" class="w-100 btn btn-warning btn-lg">
                    카카오로 회원가입
                </a>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col">
                <a th:href="${naverLoginUrl}" class="w-100 btn btn-success btn-lg">
                    네이버로 회원가입
                </a>
            </div>
        </div>
    </form>

</div>
</body>
</html>
